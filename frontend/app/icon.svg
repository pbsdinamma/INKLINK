<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="topGlow" cx="120" cy="100" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="400" cy="420" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Stroke & Shape Gradients -->
    <linearGradient id="nibBodyGrad" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <linearGradient id="linkStreamGrad" x1="140" y1="360" x2="380" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="200" y1="200" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#38BDF8" flood-opacity="0.8"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#iconShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#topGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bottomGlow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Subtle Canvas Dot Grid Matrix Overlay in Background -->
  <g opacity="0.12" fill="#FFFFFF">
    <circle cx="112" cy="112" r="3.5"/>
    <circle cx="184" cy="112" r="3.5"/>
    <circle cx="256" cy="112" r="3.5"/>
    <circle cx="328" cy="112" r="3.5"/>
    <circle cx="400" cy="112" r="3.5"/>
    
    <circle cx="112" cy="184" r="3.5"/>
    <circle cx="400" cy="184" r="3.5"/>
    
    <circle cx="112" cy="256" r="3.5"/>
    <circle cx="400" cy="256" r="3.5"/>
    
    <circle cx="112" cy="328" r="3.5"/>
    <circle cx="400" cy="328" r="3.5"/>
    
    <circle cx="112" cy="400" r="3.5"/>
    <circle cx="184" cy="400" r="3.5"/>
    <circle cx="256" cy="400" r="3.5"/>
    <circle cx="328" cy="400" r="3.5"/>
    <circle cx="400" cy="400" r="3.5"/>
  </g>

  <!-- MAIN MARK: Stylized Fountain Nib + Collaborative Link Loop -->
  <!-- Underlying Flow / Kinetic Ribbon connecting the whiteboard nodes -->
  <path d="M 172 328 C 128 284 128 212 176 168 C 224 124 294 136 348 186 C 402 236 406 308 360 354 C 316 398 246 390 196 342" 
        stroke="url(#linkStreamGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95"
        filter="url(#glowEffect)"/>

  <!-- Core Precision Pen Nib / Stylus Element tilted at dynamic 45° angle -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#iconShadow)">
    <!-- Pen Nib Outer Geometry -->
    <path d="M 256 128 L 314 220 C 322 232 324 246 322 260 L 306 348 C 304 358 296 366 286 366 L 226 366 C 216 366 208 358 206 348 L 190 260 C 188 246 190 232 198 220 Z" 
          fill="url(#nibBodyGrad)"/>
    
    <!-- Pen Center Slit (Digital Ink Channel) -->
    <line x1="256" y1="134" x2="256" y2="256" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Pen Nib Heart Hole / Interlocking Link Portal -->
    <circle cx="256" cy="272" r="16" fill="#4F46E5"/>
    <circle cx="256" cy="272" r="9" fill="url(#linkStreamGrad)"/>

    <!-- Subtle Tip Sparkle / Contact Point -->
    <circle cx="256" cy="130" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- Collaborative Connection Nodes (representing multi-user presence & linking) -->
  <!-- Node 1: Cyan (User A presence) -->
  <circle cx="164" cy="172" r="14" fill="#FFFFFF" filter="url(#nodeGlow)"/>
  <circle cx="164" cy="172" r="9" fill="#06B6D4"/>

  <!-- Node 2: Pink / Coral (User B presence) -->
  <circle cx="362" cy="350" r="14" fill="#FFFFFF" filter="url(#nodeGlow)"/>
  <circle cx="362" cy="350" r="9" fill="#F43F5E"/>

  <!-- Node 3: Electric Amber Sparkle (Ideation / Spark) -->
  <g transform="translate(352, 148)">
    <path d="M 0 -16 C 0 -6 6 0 16 0 C 6 0 0 6 0 16 C 0 6 -6 0 -16 0 C -6 0 0 -6 0 -16 Z" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="4" fill="#FEF3C7"/>
  </g>
</svg>
